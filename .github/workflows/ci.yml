# فحص + صورة + نشر تلقائي لسيستم 1.
#
# على كل طلب دمج: بيفحص (أنواع، أسرار، اختبارات، بناء، مسار كامل) وبيبني الصورة وبيجرّب إنها بتردّ.
# بعد الدمج على main: بينشر الصورة على ghcr.io وبيقول لكوليفاي ينشر (كل ما يتراكم شغل، بينزل لحاله).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    # قاعدة حقيقية للاختبارات: بيطبّق عليها الترحيل على قاعدة فاضية
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password # scan:ok
          POSTGRES_DB: zaki_s1_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d zaki_s1_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5432/zaki_s1_ci # scan:ok
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: عميل قاعدة البيانات
        run: npm run db:generate
      - name: ترحيل القاعدة (على قاعدة فاضية)
        run: npm run db:migrate
      - name: البذور (آمنة للتكرار)
        run: npm run db:seed
      - name: الأنواع
        run: npm run typecheck
      - name: فحص الأسرار
        run: npm run secrets
      - name: اختبارات الوحدات
        run: npm test
      - name: بناء
        run: npm run build
      - name: متصفح للمسار الكامل
        run: npx playwright install --with-deps chromium
      - name: مسار كامل
        run: npm run test:e2e
        env:
          CI: "true"

  image:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: اسم الصورة والتاغ
        id: image
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "app=ghcr.io/$owner/zaki-s1" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/$owner/zaki-s1-worker" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: ابني صورة الموقع
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          load: true
          push: false
          tags: zaki-s1:smoke

      - name: ابني صورة العامل
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          load: true
          push: false
          tags: zaki-s1-worker:smoke

      - name: بتشتغل وبتردّ؟
        run: |
          set -eu
          docker run -d --name smoke -p 3000:3000 zaki-s1:smoke
          code=000
          for _ in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done
          echo "HTTP: $code"
          if [ "$code" != "200" ]; then
            docker logs smoke 2>&1 | tail -60 || true
            exit 1
          fi

      - name: وقّفها
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

      # ── من هون وتحت: بس على main ──
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: انشر الصور المجرّبة
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          app='${{ steps.image.outputs.app }}'
          worker='${{ steps.image.outputs.worker }}'
          tag='${{ steps.image.outputs.tag }}'
          docker tag zaki-s1:smoke "$app:$tag"
          docker tag zaki-s1:smoke "$app:main"
          docker tag zaki-s1-worker:smoke "$worker:$tag"
          docker tag zaki-s1-worker:smoke "$worker:main"
          for t in "$app:$tag" "$app:main" "$worker:$tag" "$worker:main"; do docker push "$t"; done

      # ── النشر التلقائي ──
      # بيحتاج: السر COOLIFY_TOKEN، والمتغيّرين COOLIFY_URL (عنوان كوليفاي) وCOOLIFY_S1_APP_UUID وCOOLIFY_S1_WORKER_UUID.
      # بلا واحد منهم الخطوة بتطبع سطر وبتنجح، والنشر بيضل يدوي من كوليفاي.
      - name: قول لكوليفاي ينشر
        if: github.ref == 'refs/heads/main'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          APP_UUID: ${{ vars.COOLIFY_S1_APP_UUID }}
          WORKER_UUID: ${{ vars.COOLIFY_S1_WORKER_UUID }}
        run: |
          set -eu
          if [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_URL:-}" ]; then
            echo "كوليفاي مش مربوط بعد — النشر يدوي (Deploy)."
            exit 0
          fi
          for uuid in "$APP_UUID" "$WORKER_UUID"; do
            [ -z "$uuid" ] && continue
            curl -fsS --max-time 30 -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deploy?uuid=$uuid&force=false" > /dev/null
            echo "كوليفاي عم ينشر $uuid"
          done
